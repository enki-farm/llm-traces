# Local development stack: Grafana + Tempo
#
# Usage:
#   npm run build:standalone        # build plugin into dist/
#   docker compose -f docker/docker-compose.yml up --build
#
# Then open http://localhost:3000 (admin / admin)
# Rebuild with --build only when dist/ or provisioning/ change.

name: llm-traces-app

services:
  tempo:
    build:
      context: ..
      dockerfile_inline: |
        FROM grafana/tempo:3.0.3
        COPY provisioning/tempo/tempo.yaml /etc/tempo.yaml
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"

  grafana:
    build:
      context: ..
      dockerfile_inline: |
        FROM grafana/grafana:13.2.2-slim
        USER root
        COPY provisioning/plugins /etc/grafana/provisioning/plugins
        COPY provisioning/datasources/tempo.yaml /etc/grafana/provisioning/datasources/tempo.yaml
        COPY dist /var/lib/grafana/plugins/llm-traces-app
        USER grafana
    depends_on:
      - tempo
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_DEFAULT_APP_MODE: development
      GF_PATHS_PLUGINS: /var/lib/grafana/plugins
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: llm-traces-app
